name: Deploy to Cloudflare

# Direct deploy to Cloudflare Workers on every push to main — no Lovable step.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with "Edit Cloudflare Workers" + "Workers R2 Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account id
# Optional (only if you want CI to (re)set the Worker's runtime secrets):
#   GEMINI_API_KEY, LOVABLE_API_KEY, EDIT_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: bun run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Ensure R2 bucket exists
        run: npx --yes wrangler@4 r2 bucket create plantsposter-state || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inject R2 binding into built wrangler config
        working-directory: .output/server
        run: |
          node -e '
            const fs = require("fs");
            const p = "wrangler.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.r2_buckets = [{ binding: "POSTER_STATE", bucket_name: "plantsposter-state" }];
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("Injected R2 binding:", JSON.stringify(c.r2_buckets));
          '

      - name: Push runtime secrets (optional, skipped if unset)
        working-directory: .output/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          EDIT_KEY: ${{ secrets.EDIT_KEY }}
        run: |
          set -e
          put_secret () {
            local name="$1"; local value="$2"
            if [ -n "$value" ]; then
              echo "Setting secret $name"
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            fi
          }
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret LOVABLE_API_KEY "$LOVABLE_API_KEY"
          put_secret EDIT_KEY "$EDIT_KEY"

      - name: Deploy Worker
        working-directory: .output/server
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
